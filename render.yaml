# Render Blueprint (free tier). Verify field names at render.com/docs/yaml-spec. NOTE: SQLite on Render free is wiped on restart/sleep.
services:
  - type: web
    name: bluepulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - {key: PYTHON_VERSION, value: "3.12"}
      - {key: LLM_PROVIDER, value: nugen}
      - {key: SENSOR_KEYS, sync: false}
      - {key: NUGEN_API_KEY, sync: false}
      - {key: NUGEN_MODEL_ID, sync: false}
      - {key: CORS_ORIGINS, sync: false}
  - type: web
    name: bluepulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - {key: VITE_API_URL, sync: false}
    routes:
      - {type: rewrite, source: /*, destination: /index.html}
